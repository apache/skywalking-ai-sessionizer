# Three calls on one stream, each with its request and its response joined
# to it, a file for each call. Every request cites the first prompt, which is
# too large to land, so no request can be rebuilt from the root.
checkpoints:
  final:
    kinds: {llm.call: 3}
    view:
      state: verified
      provider_bodies: 6
      provider_files: 3
      captured_prompts: 3
collect:
  # Smaller than the first prompt.
  max_delta_bytes: 4096
push:
  kinds: [transcript, provider_body, round]
