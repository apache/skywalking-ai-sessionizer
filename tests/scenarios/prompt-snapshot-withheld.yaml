# The same session as prompt-snapshot, with its provider bodies, read by a
# view that withholds the system prompt and the tool schemas: each snapshot
# step keeps its place, its flags and its size, loses its text and says
# omitted, no call lists a body, and the summary counts what was withheld.
provider_bodies: true
steps:
  - input: is the service healthy
  - inject: {type: prompt_snapshot, system_prompt: "You are an advisor. Investigate with the tools."}
  - inject: {type: todo_reminder, text: your todo list is empty}
  - inject:
      type: prompt_snapshot
      system_prompt: "You are an advisor. Investigate with the tools."
      tools:
        - {name: Read, description: Read a file.}
        - {name: Bash, description: Run a command.}
  - call: {text: Checking.}
