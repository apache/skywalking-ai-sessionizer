# A child that starts late. The first checkpoint lands the child's bodies,
# which are written ten seconds on; the main stream's next call is planned
# after that checkpoint and written before them. A body is new when the session
# does not hold it, not when it comes after what landed before.
title: a child that starts late
provider_bodies: true
steps:
  - input: start
  - call:
      agent:
        name: helper
        prompt: look around
        after: 10s
        steps:
          - call: {text: Looking.}
    checkpoint: launched
  - call: {text: Back on main.}
