# The run holds every step the agent produced, and there is no call node. The
# talk's reply is read from its run, so it is there only if the messages are.
checkpoints:
  final:
    kinds: {message.assistant: 2, message.synthetic: 1, thinking: 1, tool: 1, llm.call: 0, run: 1}
    view: {first_talk: {label: find the failing test, reply: test_mean fails., runs: 1}}
    nodes:
      tool/t1: {kind: tool, refs: 2, attrs: {result: available, result_join: exact_unique}}
