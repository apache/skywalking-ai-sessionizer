# One conversation whose first prompt is long, so every later request of the
# chain shares a front of several kilobytes with the one before and lands as
# a copy of it, and cites the system prompt and the tool descriptions as
# pieces. Removing the files at a checkpoint takes away the tip a later
# request copies and the pieces it cites, so retention must keep both for
# the bodies after it to be cut as they would be with nothing removed.
