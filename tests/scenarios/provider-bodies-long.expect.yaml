# Five calls on one stream, each with its request and its response joined to
# it: ten bodies, five captured prompts. Later requests copy the front of the
# one before, so the bodies fit in four small files.
checkpoints:
  final:
    kinds: {llm.call: 5}
    view:
      state: verified
      provider_bodies: 10
      provider_files: 4
      captured_prompts: 5
collect:
  # Small, so the provider bodies spread over several files, and larger than
  # the first request, which lands whole so the later ones can copy it.
  max_delta_bytes: 16384
push:
  kinds: [transcript, provider_body, round]
