# An application trims the history it sends: after three turns, the next
# request leaves out the two oldest messages after the first. No transcript
# record shows it, only the request; the call that sends it says its history
# changed, a card stands before it with what was kept and dropped, and the
# cause is unavailable. It is no context reset: the calls stay in their epoch.
title: a history trimmed with no mark
provider_bodies: true
steps:
  - input: what is the timeout?
  - call: {text: "It is 30 seconds."}
  - input: and the retries?
  - call: {text: "There are 3 retries."}
  - input: and the backoff?
  - call: {text: "It doubles each time."}
  - forget: 2
  - input: summarise the three
  - call: {text: "30 seconds, 3 retries, doubling backoff."}
