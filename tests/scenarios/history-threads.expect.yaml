# Six calls: four on the main stream across the resume, two on the
# searcher's thread. The first of each stream has no history before it, and
# every other one keeps the history of the call before it, through the resume,
# which starts a new thread with the whole list again; no card.
checkpoints:
  final:
    kinds: {llm.call: 6, history.change: 0}
    history: {first: 2, kept: 4}
    nodes:
      # The call after the resume: its request holds the whole list again.
      call/s6-call-0b51c11a1403: {kind: llm.call, attrs: {history: kept, history_from: call/s3-call-0b51c11a1403, history_messages: 5, history_reply: back, system_changed: "no"}}
      # The searcher's second call continues the searcher's own thread.
      call/searcher-s2-call-0b51c11a1403: {kind: llm.call, attrs: {history: kept, history_from: call/searcher-s1-call-0b51c11a1403, history_messages: 3, history_reply: back}}
    view:
      state: verified
      provider_bodies: 12
      captured_prompts: 6
