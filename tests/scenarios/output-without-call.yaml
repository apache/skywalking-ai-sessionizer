# A runtime that records what the model said but not which provider call said
# it. Kiro's V3 engine is one: a turn lists its request ids, and no record names
# one of them.
#
# Every word stays. The text, the reasoning and the tool use become steps of the
# run that holds them, and no call node is written, because grouping the records
# into calls would draw a boundary the runtime never stated. A message the client
# made, with no call named either, stays a synthetic message in the same run.
steps:
  - input: find the failing test
  - call:
      unidentified: true
      thinking: The test file has one assertion that can fail.
      text: I will run the tests.
      tool: {id: t1, name: Bash, input: {command: python3 -m unittest}, result: FAILED (failures=1)}
  - call: {unidentified: true, text: test_mean fails.}
  - error: {text: "API Error: the request was refused.", unidentified: true}
