# Every kind of file a session leaves: the main transcript, a child agent's
# transcript and meta file, a workflow's journal, manifest and script, and
# the rounds. The push must carry all six kinds, and the export page's
# rules hold for each.
title: every kind of file
steps:
  - input: check everything
  - call:
      thinking: unavailable
      text: Checking.
      tool: {id: t1, name: Bash, input: {command: make check}, result: {text: all green, after: 500ms}}
      usage: {in: 2, out: 50, cache_read: 900, cache_write: 100}
  - call:
      agent: {name: helper, prompt: look at the tests, steps: [{call: {text: tests look fine, usage: {out: 20}}}], notify: true}
  - call:
      workflow:
        name: verify
        children:
          - {name: lint, prompt: run the linter, steps: [{call: {text: lint done}}]}
          - {name: docs, prompt: check the docs, steps: [{call: {text: docs done}}]}
    checkpoint: launched
  - call: {text: Everything checks out.}
  - reset: {summary: "Summary: everything was checked."}
