# A headless run, claude -p or an Agent SDK application, over two prompts. Its
# prompts carry no origin: the runtime writes promptSource "sdk" instead, on
# every one measured. Each prompt is still the input that opens its talk, and
# the question has to be on the page beside its answer. The run also marks a
# background agent's notification as sent through the SDK, and that one keeps
# its origin: it reports the agent, and is not a question.
title: headless run
entrypoint: sdk-cli
steps:
  - input: read the README and say what the project is
  - call: {text: Reading it, tool: {name: Read, input: {file_path: README.md}, result: "# asz"}}
  - call: {text: It is asz.}
  - input: and what does it collect
  - call:
      agent: {name: scout, prompt: list what it collects, steps: [{call: {text: transcripts}}], notify: true}
  - call: {text: Conversation logs.}
