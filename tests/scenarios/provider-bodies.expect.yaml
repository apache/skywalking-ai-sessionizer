# Seven calls, five on the main stream and two on the searcher's, each with
# its request and its response joined to it: fourteen bodies, seven captured
# prompts.
checkpoints:
  final:
    kinds: {llm.call: 7, epoch.boundary: 1}
    view:
      state: verified
      provider_bodies: 14
      provider_files: 5
      captured_prompts: 7
collect:
  # Small, so the provider bodies spread over many files.
  max_delta_bytes: 8192
push:
  kinds: [transcript, agent_meta, provider_body, round]
