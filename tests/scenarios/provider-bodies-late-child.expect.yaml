# Three calls, each with its request and response, all landed and joined
# across the two passes.
checkpoints:
  launched:
    kinds: {llm.call: 2}
  final:
    kinds: {llm.call: 3}
    view:
      state: verified
      provider_bodies: 6
      captured_prompts: 3
push:
  kinds: [transcript, agent_meta, provider_body, round]
