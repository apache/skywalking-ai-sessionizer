# Provider bodies as Claude Code 2.1.302 writes them: a process's first
# request starts a provider thread and holds the whole message list, and
# every later request continues it from the response before and holds only
# what is new. A resumed process starts a new thread with the whole list
# again, and a child has a thread of its own. Built from each thread, every
# call's history is the one before it with the reply next: kept, and no card.
title: provider threads across a resume
provider_bodies: true
provider_threads: true
steps:
  - input: read the configuration and summarise it
  - call:
      text: Reading it.
      tool:
        name: Read
        input: {file_path: /Users/dev/scenario/config.yaml}
        result: {text: "timeout: 30\nretries: 3\n", after: 200ms}
  - call: {text: "The timeout is 30 seconds, with 3 retries."}
  - resume: true
  - input: find where the timeout is used
  - call:
      agent:
        name: searcher
        prompt: find every use of the timeout
        steps:
          - call:
              text: Searching.
              tool: {name: Bash, input: {command: grep -rn timeout .}, result: {text: "server.go:3: var timeout = 30", after: 300ms}}
          - call: {text: It is used in server.go.}
  - call: {text: The searcher found it in server.go.}
