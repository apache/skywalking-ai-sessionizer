checkpoints:
  launched:
    rounds: 1
    kinds: {stream: 4, agent.call: 2, agent.launch_ack: 2, agent.output: 3, runtime.notification: 1}
    relations: {starts: 3, ends_with: 3, reports: 1}
  final:
    rounds: 2
    delta: true
    kinds: {epoch.boundary: 1, epoch.summary: 1, talk: 5}
    unresolved: {open: 0}
    view: {state: verified, rounds: 2, files: 11}  # main twice, helper, its meta, two children, journal, manifest, script; and two rounds
push:
  kinds: [transcript, agent_meta, journal, workflow_manifest, workflow_script, round]
