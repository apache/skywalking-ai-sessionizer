# One session, landed and parsed in three stages: from the start to the
# first checkpoint, from there to the second, and from there to the end.
# Three rounds come out, over landed files cut at each stage, and the final
# document must cover the whole session as if it had been parsed at once.
title: three rounds
steps:
  - input: start the work
  - call: {text: Starting, tool: {name: Bash, input: {command: make build}, result: built}}
  - call: {text: Build done.}
    checkpoint: first
  - input: now check it
  - call:
      agent: {name: checker, prompt: check the build, steps: [{call: {text: checks pass}}], notify: true}
  - call: {text: Checks done.}
    checkpoint: second
  - input: wrap up
  - call: {text: Wrapping up, tool: {name: Bash, input: {command: git status}, result: clean}}
  - reset: {summary: "Summary: built, checked, wrapped up."}
  - input: one more thing
  - call: {text: All done.}
