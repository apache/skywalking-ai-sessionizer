# Reasoning a runtime kept the text of, beside reasoning it kept only the
# signature of.
#
# A thinking block always carries a signature, and the adapter drops it: a
# provider verifies it and a reader cannot read it. That is true whether or not
# the reasoning text survived, so both records land with the drop recorded. The
# sd writer used to record it only for reasoning that was already gone, and the
# same scenario then landed different records in the two formats, which only
# `records_match` could see. Every other scenario writes `unavailable`, so the
# branch with text had no cover at all.
steps:
  - input: work out why the loader is slow
  - call:
      thinking: The second call reads the same file, so the cost is the parse and not the disk.
      text: The parse is the cost.
  - call: {thinking: unavailable, text: Caching the parsed form removes it.}
