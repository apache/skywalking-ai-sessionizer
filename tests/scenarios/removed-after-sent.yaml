# A scenario session, removed once all of it is sent.
#
# One session holds every kind of file a removal deletes: the main
# transcript, a child's transcript and meta file, a workflow's journal,
# manifest and script, a script filed under another project, and the
# plugin's output. Every scenario runs the removed_after_sent property. This
# one gives it every kind at once, and the chain tests stop its removal at
# every point it reaches.
title: removed once sent
steps:
  - input: fix the timeout and check everything
  - call:
      text: Fixing it.
      tool:
        name: Bash
        input: {command: "sed -i 's/= 10/= 30/' server.go"}
        result: {text: "", after: 500ms}
        changes:
          - {path: server.go, before: "package main\n\nvar timeout = 10\n", after: "package main\n\nvar timeout = 30\n"}
      usage: {in: 2, out: 50, cache_read: 900, cache_write: 100}
  - call:
      agent: {name: helper, prompt: look at the tests, steps: [{call: {text: tests look fine, usage: {out: 20}}}], notify: true}
  - call:
      workflow:
        name: verify
        script_project: -Users-dev-script-filed-elsewhere
        children:
          - {name: lint, prompt: run the linter, steps: [{call: {text: lint done}}]}
  - call: {text: Everything checks out.}
