[project]
name = "apache-skywalking-asz-langchain"
version = "0.5.0"
description = "Records what a LangChain agent's tool calls changed on disk, for Apache SkyWalking AI Sessionizer"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Apache SkyWalking" }]
keywords = ["skywalking", "observability", "langchain", "langgraph", "agent"]
dependencies = ["langchain-core>=0.3"]

[project.urls]
Homepage = "https://skywalking.apache.org/"
Repository = "https://github.com/apache/skywalking-ai-sessionizer"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["asz_langchain"]
py-modules = ["asz_langchain_boot"]

# The loader is written by "asz-langchain enable", not by the install. A wheel
# cannot place a .pth in a site directory: measured, pip puts a declared data
# file in the environment's root, where Python never reads it, and the loader
# silently never runs.
[project.scripts]
asz-langchain = "asz_langchain.cli:main"
