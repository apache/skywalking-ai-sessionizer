name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # A release tag push builds and tests everything, then creates the GitHub
  # prerelease and attaches the binaries for the release manager. Only the
  # promotion of that prerelease to a full release, after the vote, starts
  # the release image job.
  release:
    types: [released]
  # Run diagnostics on a tag. Image publication is a separate opt-in
  # for retrying a version whose GitHub release is already public.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag selected in the workflow ref, for example v0.3.0'
        required: true
      publish_image:
        description: 'Retry image publication for an existing official release'
        type: boolean
        default: false

concurrency:
  # The push of a release tag and the later promotion of its release share a
  # ref, and neither run may cancel the other. A pull request keeps one group
  # for all its updates, so a new push still cancels the run it replaces.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action used here is in the apache/*, actions/* or github/* namespace.
# The ASF GitHub Actions policy allows only those without a reviewed SHA pin,
# so docker login, buildx and the push are plain shell steps rather than
# third-party actions.
jobs:
  license:
    name: License
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      # The skywalking-eyes actions bring their own Go, pinned below what
      # go.mod requires, and the dependency check runs go with it. The
      # checks run through the Makefile instead, with the toolchain the
      # module declares, which is what make check does locally. The last
      # one regenerates the dependency licenses every binary package
      # carries and fails when the committed copy differs.
      - name: Check license headers and dependency licenses
        run: make license-check dep-check dep-licenses-check

  build:
    name: Build and Test
    if: github.event_name != 'release'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Build
        run: |
          go build -o bin/ ./cmd/asz
          go build -o bin/ ./plugins/claude-code
      # The suite is split so a failure names which layer broke. The race
      # detector needs a C toolchain, which the Windows runner does not put on
      # its path, so Windows runs without it. The tests of the command and of
      # the Claude Code plugin run here too. The plugin's tests run its hook
      # from end to end, and this is their only run on Windows.
      - name: Unit tests
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} -count=1 ./cmd/... ./pkg/... ./internal/... ./plugins/...
      - name: Scenarios, chain and boundary tests
        run: go test ${{ runner.os != 'Windows' && '-race' || '' }} -count=1 ./tests/...
      # Raw JSON must survive both implementations of encoding/json. The
      # chain tests also read files made by the earlier writer.
      - name: JSON compatibility with the earlier engine
        if: runner.os == 'Linux'
        env:
          GOEXPERIMENT: nojsonv2
        run: go test -count=1 ./pkg/sessiondata/ ./tests/...
      # The same scenarios once more, through the command a person runs, so
      # the command is exercised and a failure prints as a person sees it.
      - name: Scenarios through the command
        shell: bash
        run: |
          for f in tests/scenarios/*.yaml; do
            case "$f" in *.expect.yaml) continue;; esac
            echo "== $f"
            ./bin/asz${{ runner.os == 'Windows' && '.exe' || '' }} scenario check "$f" || exit 1
          done

  # A voter builds and tests the source package, not a clone. The source
  # package is git archive of the tag, so it lacks what .gitattributes marks
  # export-ignore, such as the renderer's fonts, and it has no .git. A test
  # that needs either passes in the build job and fails for every voter.
  # This job makes the package the way make release does, with its prefix,
  # unpacks it outside the checkout, where git finds no repository, and
  # builds and tests it there.
  source-package:
    name: Source package
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Build and test the unpacked source package
        run: |
          set -eu
          name="apache-skywalking-ai-sessionizer-$(git rev-parse HEAD)-src"
          git archive --format=tar --prefix="$name/" HEAD | tar -xf - -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/$name"
          go build ./...
          go test -count=1 ./...

  # A real OpenTelemetry Collector, not the in-process receiver the scenario
  # checks use: the protobuf the sender writes must be accepted by an OTLP
  # receiver that is not ours, and what its file exporter writes must rebuild
  # into a root that verifies. Ubuntu only, because it needs docker.
  collector:
    name: Collector
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Build
        run: make build
      - name: Push into a Collector and verify its output
        run: tools/e2e-collector.sh

  # The conversation renderer asz view embeds is Horizon's, built from the
  # commit pinned in internal/view/conversation-view/HORIZON_COMMIT and
  # committed here. This rebuilds it from that commit and fails when the
  # committed copy differs, so the copy cannot drift from its source.
  conversation-view:
    name: Conversation view
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10, the commit on the ASF allow-list
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the renderer from the pinned Horizon commit and compare
        run: make conversation-view-check

  # Builds every platform on every run but the promotion, so a broken
  # cross-compile is caught early. The artifact passes the packages to smoke
  # tests and, on a release tag push, to candidate-assets. Official promotion
  # reuses those bytes after their signatures and source are added.
  binaries:
    name: Binaries
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    # The packages job names the artifact by this version.
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Check the requested tag
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$INPUT_TAG" || {
            echo "Select the same tag as the workflow ref and the tag input."
            exit 1
          }
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Version
        id: v
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          ref="$GITHUB_REF"
          if [ "$EVENT" = "workflow_dispatch" ]; then ref="refs/tags/$INPUT_TAG"; fi
          case "$ref" in
            refs/tags/v*) v="${ref#refs/tags/v}" ;;
            *) v="$(git rev-parse HEAD)" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
      # Every platform is cross-compiled from one runner: Go needs no
      # emulation and no C toolchain for this, so one job proves them all.
      - name: Build every platform
        run: make binaries checksums VERSION=${{ steps.v.outputs.version }}
      # A tag from before the Claude Code plugin, run by hand, builds no
      # plugin. A tree that has the plugin must still run its binary.
      - name: Smoke test
        run: |
          dist/build/linux-amd64/asz version
          if [ -d plugins/claude-code ]; then
            dist/build/linux-amd64/asz-claude-plugin version
          else
            echo "::notice::this tree has no Claude Code plugin, so no plugin binary was run"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ steps.v.outputs.version }}
          path: |
            dist/*.tgz
            dist/*.zip
            dist/*.sha512
          if-no-files-found: error

  # Each binary package is run on its own platform, as a person would run
  # it. The binaries job cross-compiles every platform on one Linux runner.
  # That proves the build and nothing about the platform: a macOS or a
  # Windows binary is first started here, and so is any binary taken out of
  # its archive.
  packages:
    name: Package ${{ matrix.platform }}
    if: github.event_name != 'release'
    needs: binaries
    runs-on: ${{ matrix.runner }}
    # A run takes about a minute. If Git Bash never returns from waiting on a
    # native Windows process, the job fails here instead of holding a runner
    # for GitHub's default of six hours.
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, runner: ubuntu-latest, ext: tgz }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, ext: tgz }
          - { platform: darwin-arm64, runner: macos-latest, ext: tgz }
          # GitHub's last Intel macOS image, offered until August 2027.
          # After that, darwin-amd64 is cross-compiled and never started.
          - { platform: darwin-amd64, runner: macos-15-intel, ext: tgz }
          - { platform: windows-amd64, runner: windows-latest, ext: zip }
          - { platform: windows-arm64, runner: windows-11-arm, ext: zip }
    steps:
      # The script and the scenarios it runs come from the tree, at the ref
      # the binaries job built. Nothing is built here.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ needs.binaries.outputs.version }}
          path: dist
      # Run by hand for a tag older than this job, the tag may have no
      # tools/package-smoke.sh, or build no package for this platform. 0.1.0
      # and 0.2.0 have neither the script nor windows/arm64. Such an entry
      # says so and passes. A platform the tag's Makefile lists must still
      # have its package, so a package the binaries job lost fails here.
      - name: Run the package
        shell: bash
        env:
          VERSION: ${{ needs.binaries.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          if [ ! -f tools/package-smoke.sh ]; then
            echo "::notice::this tag has no tools/package-smoke.sh, so its $PLATFORM package is not run"
            exit 0
          fi
          platforms=$(sed -nE 's/^PLATFORMS[[:space:]]*:?=[[:space:]]*//p' Makefile)
          case " $platforms " in
            *" ${PLATFORM%-*}/${PLATFORM#*-} "*) ;;
            *)
              echo "::notice::the Makefile of this tag builds no package for $PLATFORM, so there is nothing to run"
              exit 0 ;;
          esac
          tools/package-smoke.sh "dist/apache-skywalking-ai-sessionizer-$VERSION-bin-$PLATFORM.$EXT" "$VERSION"

  # Each binary package with Claude Code, on its own platform, the way the
  # install pages tell a person to use it. The Quick install block installs
  # the package, the plugin's install commands add the marketplace at a tag,
  # and a headless session must be recorded by the plugin and collected by
  # asz. tools/claudecodecheck says what else it runs. The package, the
  # marketplace repository and the model's API are served on the runner, so
  # the job needs no secret. Claude Code has run the hooks on no platform but
  # the ones this job covers.
  claude-code:
    name: Claude Code ${{ matrix.platform }}
    if: github.event_name != 'release'
    needs: binaries
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      # A fixed version, so a new Claude Code release cannot fail a pull
      # request that did not change. Move it on purpose.
      CLAUDE_CODE_VERSION: '2.1.274'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-amd64, runner: ubuntu-latest, ext: tgz }
          - { platform: linux-arm64, runner: ubuntu-24.04-arm, ext: tgz }
          - { platform: darwin-arm64, runner: macos-latest, ext: tgz }
          - { platform: darwin-amd64, runner: macos-15-intel, ext: tgz }
          - { platform: windows-amd64, runner: windows-latest, ext: zip }
          - { platform: windows-arm64, runner: windows-11-arm, ext: zip }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ needs.binaries.outputs.version }}
          path: dist
      - name: Install Claude Code
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://claude.ai/install.sh | bash -s "$CLAUDE_CODE_VERSION"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install Claude Code
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ([scriptblock]::Create((Invoke-RestMethod https://claude.ai/install.ps1))) $env:CLAUDE_CODE_VERSION
          Join-Path $env:USERPROFILE ".local\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      # Run by hand for a tag older than this job, the tag has no check.
      - name: Follow the install pages with Claude Code
        shell: bash
        env:
          VERSION: ${{ needs.binaries.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
          EXT: ${{ matrix.ext }}
        run: |
          if [ ! -d tools/claudecodecheck ]; then
            echo "::notice::this tag has no tools/claudecodecheck, so Claude Code is not run"
            exit 0
          fi
          platforms=$(sed -nE 's/^PLATFORMS[[:space:]]*:?=[[:space:]]*//p' Makefile)
          case " $platforms " in
            *" ${PLATFORM%-*}/${PLATFORM#*-} "*) ;;
            *)
              echo "::notice::the Makefile of this tag builds no package for $PLATFORM, so there is nothing to run"
              exit 0 ;;
          esac
          go run ./tools/claudecodecheck "dist/apache-skywalking-ai-sessionizer-$VERSION-bin-$PLATFORM.$EXT" "$VERSION"

  # The Homebrew formulae, as a release writes them, through brew style,
  # brew audit --strict, brew install and brew test. The packages are built
  # here with a version of a release's form, which the manifest script
  # requires and the formulae's tests expect the binaries to report.
  homebrew:
    name: Homebrew
    if: github.event_name != 'release'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      # Run by hand for a tag older than this job, the tag has no check.
      - name: Build the packages and run the formulae through Homebrew
        run: |
          if [ ! -f tools/homebrew-check.sh ]; then
            echo "::notice::this tag has no tools/homebrew-check.sh, so the formulae are not run"
            exit 0
          fi
          make binaries checksums VERSION=0.0.0-ci
          tools/homebrew-check.sh 0.0.0-ci dist

  lint:
    name: Lint
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: Lint
        run: make lint

  # Created with the workflow token, the prerelease starts no other run.
  candidate-assets:
    name: Prerelease binaries
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [license, build, source-package, lint, binaries, packages, claude-code, homebrew, collector, conversation-view]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        with:
          name: binaries-${{ needs.binaries.outputs.version }}
          path: dist
      - name: Create the prerelease and attach the tested packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.binaries.outputs.version }}
        run: |
          platforms=$(sed -nE 's/^PLATFORMS[[:space:]]*:?=[[:space:]]*//p' Makefile)
          bash tools/ci-upload-binaries.sh "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" dist "$platforms"

  # Candidate tags build and test their packages without publishing an image.
  # A manual image retry requires an existing public GitHub release.
  docker:
    name: Docker
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'release' && github.event.action == 'released') || (github.event_name == 'workflow_dispatch' && inputs.publish_image)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Bind the build to the run's commit, even if a tag moves later.
          ref: ${{ github.sha }}
      - name: Check a manual image retry
        if: github.event_name == 'workflow_dispatch'
        env:
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$INPUT_TAG"
          test "$(gh release view "$INPUT_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft == false) and (.isPrerelease == false)')" = true
      - name: Set up buildx
        run: docker buildx create --use --name asz
      - name: Image tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse HEAD)
          # Every build is tagged with its complete commit id, never moved.
          tags="$image:$sha"
          version="$sha"
          ref="$GITHUB_REF"
          if [ "$EVENT" = "workflow_dispatch" ]; then ref="refs/tags/$INPUT_TAG"; fi
          case "$EVENT:$ref" in
            push:refs/heads/main)
              # The development head. latest is reserved for releases.
              tags="$tags,$image:main" ;;
            release:refs/tags/v*|workflow_dispatch:refs/tags/v*)
              # A release is published under the version the tag names and
              # nothing looser: no major.minor line, since a reader who
              # pulls 0.2 cannot tell which release answered. latest is the
              # one floating tag. It follows GitHub's latest release, which
              # tools/release.sh publish sets or leaves by asking the release
              # manager, so a patch of an older line does not move it.
              version="${ref#refs/tags/v}"
              tags="$tags,$image:$version"
              case "$version" in
                *-*)
                  # A pre-release such as 0.2.0-rc1 moves no floating tag.
                  ;;
                *)
                  # Read on its own line: set -e stops the step when gh fails,
                  # where the end of a pipeline would hide it and publish the
                  # release without latest. The promotion sets the label in the
                  # same request that fires this event, so it is settled here.
                  latest=$(gh api --method GET "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
                  [ -n "$latest" ] || { echo "::error::GitHub names no latest release"; exit 1; }
                  if [ "v$version" = "$latest" ]; then tags="$tags,$image:latest"; fi ;;
              esac ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::tags: $tags"
      - name: Build
        if: github.event_name == 'pull_request'
        run: docker buildx build --platform linux/amd64 --load --build-arg VERSION=pr -t asz:pr .
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: docker run --rm asz:pr version && docker run --rm asz:pr glossary | head -c 400
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          args=""
          for t in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do args="$args -t $t"; done
          docker buildx build --platform linux/amd64,linux/arm64 $args \
            --build-arg VERSION="${{ steps.meta.outputs.version }}" \
            --label org.opencontainers.image.revision="${{ steps.meta.outputs.sha }}" \
            --label org.opencontainers.image.version="${{ steps.meta.outputs.version }}" \
            --push .

  # Single fan-in job so branch protection needs only one required check.
  result:
    name: Required
    if: always()
    needs: [license, build, source-package, lint, docker, binaries, packages, claude-code, homebrew, collector, conversation-view, candidate-assets]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo "all required checks passed"
