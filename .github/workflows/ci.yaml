name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # A GitHub release is published only after the Apache vote has passed, so
  # this is the event that attaches version tags to the image.
  release:
    types: [published]
  # By hand: promote a tag whose release predates this workflow, or retry a
  # publish that failed.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote, for example v0.1.0'
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action used here is in the apache/*, actions/* or github/* namespace.
# The ASF GitHub Actions policy allows only those without a reviewed SHA pin,
# so docker login, buildx and the push are plain shell steps rather than
# third-party actions.
jobs:
  license:
    name: License
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check license headers
        uses: apache/skywalking-eyes/header@v0.9.0
      - name: Check dependency licenses
        uses: apache/skywalking-eyes/dependency@v0.9.0

  build:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum
      - name: Vet
        run: make vet
      - name: Build
        run: make build
      # `make test` covers ./... including the end-to-end adapter suite under
      # tests/. It is split out here so a failure names which layer broke.
      - name: Unit tests
        run: go test -race -count=1 ./pkg/... ./internal/...
      - name: End-to-end adapter tests
        run: go test -race -count=1 ./tests/...
      - name: Full suite
        run: make test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true
      - name: Lint
        run: make lint

  # The container image. A pull request builds it; a push to main or a
  # version tag builds it for both platforms and publishes it to GHCR under
  # this repository's name.
  docker:
    name: Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A promotion by hand builds the tag it names. Every other event
          # builds the ref that triggered it. Tags are needed to decide
          # whether a promoted version is the newest release.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
      - name: Set up buildx
        run: docker buildx create --use --name asz
      - name: Image tags
        id: meta
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -eu
          image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
          sha=$(git rev-parse HEAD)
          tags="$image:sha-${sha::8}"
          version="sha-${sha::8}"
          ref="$GITHUB_REF"
          if [ "$EVENT" = "workflow_dispatch" ]; then ref="refs/tags/$INPUT_TAG"; fi
          case "$EVENT:$ref" in
            push:refs/heads/main)
              # The development head. latest is reserved for releases.
              tags="$tags,$image:main" ;;
            push:refs/tags/v*)
              # A tag is a release candidate until the vote passes, so a tag
              # push publishes the immutable sha tag and nothing else.
              echo "::notice::${ref#refs/tags/} is a candidate; version tags are attached when its GitHub release is published" ;;
            release:refs/tags/v*|workflow_dispatch:refs/tags/v*)
              version="${ref#refs/tags/v}"
              tags="$tags,$image:$version"
              case "$version" in
                *-*)
                  # A pre-release such as 0.2.0-rc1 moves no floating tag.
                  ;;
                *)
                  tags="$tags,$image:${version%.*}"
                  # latest must name the newest release, so promoting a patch
                  # of an older line must not drag it backwards.
                  highest=$(git tag --list 'v*' --sort=-version:refname | grep -v -- '-' | head -1)
                  if [ "v$version" = "$highest" ]; then tags="$tags,$image:latest"; fi ;;
              esac ;;
          esac
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "::notice::tags: $tags"
      - name: Build
        if: github.event_name == 'pull_request'
        run: docker buildx build --platform linux/amd64 --load --build-arg VERSION=pr -t asz:pr .
      - name: Smoke test
        if: github.event_name == 'pull_request'
        run: docker run --rm asz:pr version && docker run --rm asz:pr glossary | head -c 400
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Build and push
        if: github.event_name != 'pull_request'
        run: |
          set -eu
          args=""
          for t in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' ' '); do args="$args -t $t"; done
          docker buildx build --platform linux/amd64,linux/arm64 $args \
            --build-arg VERSION="${{ steps.meta.outputs.version }}" \
            --label org.opencontainers.image.revision="${{ steps.meta.outputs.sha }}" \
            --label org.opencontainers.image.version="${{ steps.meta.outputs.version }}" \
            --push .

  # Single fan-in job so branch protection needs only one required check.
  result:
    name: Required
    if: always()
    needs: [license, build, lint, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - name: Success
        run: echo "all required checks passed"
