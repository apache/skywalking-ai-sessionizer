<!doctype html>
<html lang="en" data-theme="horizon" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conversation · SkyWalking AI Sessionizer</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!--
  The conversation is drawn by Horizon's conversation renderer, built from a
  pinned Horizon commit and embedded in asz (see conversation-view/HORIZON_COMMIT),
  so this page and Horizon's conversation page draw the same document the
  same way. The host shell carries Horizon's design tokens, themes and fonts,
  so the page needs nothing from the network but its own API.
-->
<link rel="stylesheet" href="/assets/conversation-view/host-shell/horizon-theme.css">
<link rel="stylesheet" href="/assets/conversation-view/conversation-view.css">
<script>
// The saved theme, before the first paint, so a reload does not flash.
(function () {
  try {
    var t = JSON.parse(localStorage.getItem("asz.theme") || "null");
    if (t && t.id) { document.documentElement.dataset.theme = t.id; document.documentElement.dataset.appearance = t.appearance || "dark"; }
  } catch (e) {}
})();
</script>
<style>
.asz-page { display: flex; flex-direction: column; height: 100vh; }
.asz-header { display: flex; align-items: center; gap: 14px; padding: 7px 14px; border-bottom: 1px solid var(--sw-line); background: var(--sw-bg-1); }
.asz-brand { display: flex; align-items: center; gap: 8px; color: var(--sw-fg-0); text-decoration: none; font-weight: var(--sw-fw-semibold); white-space: nowrap; }
.asz-brand img { height: 22px; }
/* White on a dark ground, brand blue on a light one, as Horizon's top bar does. */
.logo-light { display: none; }
html[data-appearance="light"] .logo-dark { display: none; }
html[data-appearance="light"] .logo-light { display: block; }
.asz-brand small { color: var(--sw-fg-2); font-weight: var(--sw-fw-regular); }
.asz-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--sw-fg-0); font-weight: var(--sw-fw-medium); }
.asz-title code { margin-left: 8px; color: var(--sw-fg-2); font-family: var(--sw-mono); font-size: var(--sw-fs-xs); font-weight: var(--sw-fw-regular); }
.asz-header label { color: var(--sw-fg-2); font-size: var(--sw-fs-xs); white-space: nowrap; }
.asz-header select { margin-left: 6px; font: inherit; color: var(--sw-fg-0); background: var(--sw-bg-2); border: 1px solid var(--sw-line); border-radius: var(--sw-radius); padding: 3px 6px; }
.asz-header a.asz-list { color: var(--sw-fg-1); text-decoration: none; font-size: var(--sw-fs-xs); white-space: nowrap; }
.asz-header a.asz-list:hover { color: var(--sw-fg-0); }
#conversation { flex: 1; min-height: 0; }
.asz-wait, .asz-error { padding: 48px 24px; max-width: 64ch; }
.asz-wait { color: var(--sw-fg-1); }
.asz-wait progress { display: block; width: 100%; max-width: 360px; margin-top: 12px; accent-color: var(--sw-accent); }
.asz-wait small { display: block; margin-top: 6px; color: var(--sw-fg-2); font-variant-numeric: tabular-nums; }
.asz-error { color: var(--sw-err); }
.asz-error code { font-family: var(--sw-mono); }
</style>
</head>
<body>
<div class="asz-page">
  <header class="asz-header">
    <a class="asz-brand" href="/" aria-label="SkyWalking AI Sessionizer"><img class="logo-dark" src="/logo.svg" alt="SkyWalking"><img class="logo-light" src="/logo-blue.svg" alt="SkyWalking"><span>AI Sessionizer</span></a>
    <div class="asz-title" id="title"></div>
    <a class="asz-list" href="/">All conversations</a>
    <label>Theme<select id="theme" aria-label="Theme"></select></label>
  </header>
  <div id="conversation"><div class="asz-wait" id="wait">Loading the conversation…</div></div>
</div>
<script type="module">
import { mountConversationView, isSupportedDocument, makeFormatter } from "/assets/conversation-view/conversation-view.js";

const id = decodeURIComponent(location.pathname.replace(/^\/c\//, ""));
const api = "/api/c/" + encodeURIComponent(id);
const host = document.getElementById("conversation");
const wait = document.getElementById("wait");
const titleEl = document.getElementById("title");
document.title = id + " · SkyWalking AI Sessionizer";

// ---- theme: the host shell's themes, the choice kept in the browser ----
const themeSelect = document.getElementById("theme");
fetch("/assets/conversation-view/host-shell/themes.json").then(r => r.json()).then(themes => {
  const current = document.documentElement.dataset.theme;
  for (const t of themes) {
    const o = document.createElement("option");
    o.value = t.id; o.textContent = t.label; o.selected = t.id === current;
    themeSelect.appendChild(o);
  }
  themeSelect.onchange = () => {
    const t = themes.find(x => x.id === themeSelect.value);
    if (!t) return;
    document.documentElement.dataset.theme = t.id;
    document.documentElement.dataset.appearance = t.appearance;
    try { localStorage.setItem("asz.theme", JSON.stringify(t)); } catch (e) {}
  };
}).catch(() => { themeSelect.parentElement.hidden = true; });

// ---- the document, with the download shown against its size ----
const mb = n => (n / 1048576).toFixed(n < 10485760 ? 1 : 0) + " MB";
async function load() {
  const r = await fetch(api + "/view");
  if (!r.ok) {
    let msg = r.status + " " + r.statusText;
    try { msg = (await r.json()).error || msg; } catch (e) {}
    throw new Error(msg);
  }
  const total = Number(r.headers.get("Content-Length")) || 0;
  const parts = [];
  let got = 0;
  const reader = r.body.getReader();
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    parts.push(value);
    got += value.byteLength;
    wait.innerHTML = "Receiving the conversation…" +
      (total ? '<progress max="' + total + '" value="' + got + '"></progress><small>' + mb(got) + " of " + mb(total) + "</small>"
             : "<small>" + mb(got) + "</small>");
  }
  const buf = new Uint8Array(got);
  let off = 0;
  for (const p of parts) { buf.set(p, off); off += p.byteLength; }
  wait.textContent = "Reading " + mb(got) + "…";
  return JSON.parse(new TextDecoder().decode(buf));
}

async function glossary() {
  try {
    const r = await fetch("/api/glossary");
    return r.ok ? await r.json() : null;
  } catch (e) { return null; }
}

// ---- the reader's position lives in the address, so a link lands on a step ----
const stateFromURL = () => {
  const q = new URLSearchParams(location.search);
  const s = {};
  for (const k of ["talk", "step", "stream"]) if (q.get(k)) s[k] = q.get(k);
  return s;
};
const same = (a, b) => ["talk", "step", "stream"].every(k => (a[k] || "") === (b[k] || ""));

try {
  const [doc, gl] = await Promise.all([load(), glossary()]);
  if (!isSupportedDocument(doc)) throw new Error("not a document this viewer can draw: " + doc.format + " " + doc.version);
  const title = doc.summary && doc.summary.title ? doc.summary.title : "(untitled)";
  titleEl.innerHTML = "";
  titleEl.append(title);
  const code = document.createElement("code");
  code.textContent = doc.conversation;
  titleEl.append(code);
  document.title = title + " · SkyWalking AI Sessionizer";
  host.innerHTML = "";
  const view = mountConversationView(host, {
    document: doc,
    formatter: makeFormatter(navigator.language),
    glossary: gl,
    // The landed record behind a step, by address: only asz has the files.
    loadRecord: ref => fetch(api + "/record/" + ref.seq + "/" + ref.row).then(res => {
      if (!res.ok) throw new Error("record " + ref.seq + "/" + ref.row + ": " + res.status);
      return res.json();
    }),
    state: stateFromURL(),
    onStateChange: s => {
      if (same(s, stateFromURL())) return;
      const q = new URLSearchParams();
      for (const k of ["talk", "step", "stream"]) if (s[k]) q.set(k, s[k]);
      history.replaceState(null, "", q.toString() ? "?" + q : location.pathname);
    },
  });
  addEventListener("popstate", () => view.setState(stateFromURL()));
} catch (err) {
  host.innerHTML = "";
  const box = document.createElement("div");
  box.className = "asz-error";
  box.append("This conversation could not be shown: ");
  const c = document.createElement("code");
  c.textContent = err && err.message ? err.message : String(err);
  box.append(c);
  host.append(box);
}
</script>
</body>
</html>
