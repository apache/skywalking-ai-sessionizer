# A shared cache that keeps what an answer's own Cache-Control allows, for
# everyone: the key leaves the Authorization header out, as a cache that
# reuses a public answer without asking the server does. Every answer says
# whether it came from the cache.
worker_processes 1;
events {}
http {
    proxy_cache_path /tmp/cache keys_zone=pages:1m;
    server {
        listen 8080;
        proxy_cache pages;
        proxy_cache_key $request_uri;
        add_header X-Cache $upstream_cache_status always;
        location /plain/ {
            proxy_pass http://plain:8788/;
        }
        location /open/ {
            proxy_pass http://open:8788/;
        }
    }
}
