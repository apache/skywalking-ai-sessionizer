github:
  description: Apache SkyWalking AI Sessionizer - conversation-level observability for long-lived AI agents
  homepage: https://skywalking.apache.org/
  labels:
    - skywalking
    - observability
    - apm
    - ai
    - llm
    - agent
    - claude-code
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  dependabot_updates: true
  # No branch protection and no required review. The project is new and has one
  # committer, so there is nobody to review a pull request. Null is the form the
  # ASF documentation gives for removing every protection rule.
  protected_branches: ~
