github:
  description: Apache SkyWalking AI Sessionizer - conversation-level observability for long-lived AI agents
  homepage: https://skywalking.apache.org/
  labels:
    - skywalking
    - observability
    - apm
    - ai
    - llm
    - agent
    - claude-code
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  dependabot_updates: true
  # A pull request merges only when the Required check passes on a branch that
  # is up to date with main. Required is the one CI job that every other job
  # fans in to. No review is required: the project has one committer, so there
  # is nobody to review a pull request.
  protected_branches:
    main:
      required_status_checks:
        strict: true
        contexts:
          - Required
  # Shows the Update branch button on a pull request that is behind main.
  pull_requests:
    allow_update_branch: true
