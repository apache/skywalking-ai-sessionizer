# Default configuration for asz.
#
# Every asz command that reads a configuration reads this file when it is in
# the working directory and no -config flag is given; asz token and asz
# version read none. Every value below is the built-in default, so deleting
# the file changes nothing. It is here so the defaults can be read and edited
# without reading Go.

storage:
  # Where collected data lands and where conversations are assembled.
  # Relative paths are resolved from the working directory. The default,
  # ./data, is ignored by git so a checkout never stages private transcripts.
  root: ./data

  # How long a conversation may be idle, with nothing new landed in any of
  # its streams, before this root keeps less of it. Whether it was sent, and
  # whether an endpoint is set, does not matter. Each value is a duration
  # such as 72h, or days such as 30d, and -1 is off. Only both off keeps
  # everything.
  retention:
    # To save disk, keep only the conversation's metadata: what was said and
    # run is removed from every landed file, and who did what, when, in what
    # order and at what cost stays. New activity continues the same
    # conversation. The removed content cannot be restored here; only a
    # receiver that accepted it still has it.
    metadata_only_after: -1
    # Remove everything of the conversation, its metadata too, and retire
    # it. A retired conversation is never collected again, even when its
    # runtime resumes it, so set this longer than the runtime keeps its own
    # history. It is at least metadata_only_after, which must be set too;
    # equal to it goes straight to retirement.
    retire_after: -1

adapters:
  - name: claude-code-local
    enabled: true

    # The directory Claude Code keeps its projects in, one directory per
    # project. Leave empty to resolve it the way Claude Code does: projects
    # under CLAUDE_CONFIG_DIR, then under XDG_CONFIG_HOME/claude, then under
    # ~/.claude. Set it only to collect from a copy or a mounted corpus, and
    # name that copy's projects directory, not the directory above it.
    source_root: ""

    # Session filters. A session is judged by the working directory its main
    # transcript was recorded under. An entry starting with / is a working
    # directory, with ** for everything beneath it; anything else is a glob
    # matched against the source directory name as Claude Code wrote it.
    # An empty include list means every session is a candidate.
    include: []
    # Claude Code runs its own helper agents in scratch directories under
    # /private/tmp. Those sessions are the tool's, not yours, so they are
    # left out. A real session that merely used a scratch directory for a
    # child agent is still collected, because the filter looks at the main
    # transcript's directory only.
    exclude:
      - /private/tmp/**

    collector:
      # watch runs the pipeline continuously: every interval it lands what
      # is new, parses what moved, and sends what the export block asks
      # for. once makes a single pass and exits, which is the backfill path
      # over history that already exists. asz server runs the same pipeline
      # beside the page, and shows the last and the next refresh on its
      # list page.
      #
      # Both commands make a pass when they start, then one every interval.
      # A pass lands what moved as new files, so a short interval lands many
      # small files, and each file is one log record when it is sent. Keep
      # a few seconds for tests; scenario feeds write their own.
      mode: watch
      interval: 10m

      # The largest landed file the collector writes, in bytes. A large
      # catch-up is split into several files rather than one enormous one.
      # A single record larger than this lands alone, with its largest
      # payloads omitted until it fits: each keeps its size and SHA-256 and
      # says too_large. A file travels whole as one log record, so this is
      # also the largest record a receiver has to accept. A change applies
      # to new files only: asz repack re-cuts an existing root into a new one.
      max_delta_bytes: 2097152

  # The workspace change records the asz Claude Code plugin writes: which
  # files each shell command changed, and each edit made inside a
  # subagent, as git-style hunks. The plugin writes them beside Claude
  # Code's own files and needs nothing from asz; this adapter discovers
  # and tails them, and the view joins each record to its step. On by
  # default because it costs nothing when the plugin is not installed.
  - name: langsmith-ingest
    # The LangSmith tracing client, received. An application built on
    # LangChain or LangGraph already carries that client, because langsmith is
    # a dependency of langchain-core, so pointing it here is the whole
    # integration and nothing in the application changes:
    #
    #   LANGSMITH_TRACING=true
    #   LANGSMITH_ENDPOINT=http://<this address>
    #   LANGSMITH_API_KEY=<anything token accepts>
    #   LANGSMITH_PROJECT=<a name>
    #
    # Off until pointed at.
    enabled: false

    # The address to serve on. It binds locally by default because what
    # arrives here is whole prompts and whole tool output. A client in another
    # container needs an address it can reach, and then a token.
    listen: 127.0.0.1:1985

    # Required in the x-api-key header when set. Empty accepts any key: the
    # client insists on sending one and has nothing to prove to a collector on
    # the same machine.
    token: ""

    # The run metadata keys that may carry the thread, in the order they are
    # tried. These three are what the client documents; an application that
    # names its own says so here.
    thread_keys:
      - thread_id
      - session_id
      - conversation_id

    # The dimensions that together own a conversation, in order. "project" is
    # the client's project name and anything else is a metadata key.
    #
    # A bare thread key is not an identity: two applications can both use the
    # project "production" and the thread "123", and merging them would put two
    # histories in one conversation while every join stayed valid. Dropping
    # "project" merges every project that shares a thread key, which is a
    # choice to make here rather than one to discover later.
    scope:
      - project
      - thread

    # What each model call was sent, and what came back, landed beside the
    # conversation. It is the evidence the continuity check between calls
    # runs on, and it shows a nested agent's own prompt. Cut against what the
    # session already holds: measured, a long conversation lands under half
    # of what it was on the wire, and a conversation of a few short calls
    # lands more than it was, because the note that says how to rebuild a
    # body costs more than a small body saves.
    provider_bodies: true

    collector:
      # What the receiver accepts waits in an inbox until a pass converts it,
      # so this is how often that happens.
      mode: watch
      interval: 10m
      # The largest landed file a conversion writes. One request can carry
      # more than this: a single turn with a 20 KB command and a 32 KB result
      # measured 3 MB, so a request is cut across files rather than landing as
      # one. A record larger than the budget lands alone in a file of its own,
      # with its largest payloads omitted until it fits.
      max_delta_bytes: 2097152

  - name: changes
    enabled: true

    # Where the plugin's output is. Leave empty to resolve it the way the
    # plugin does: the plugins/data directory beside projects under
    # CLAUDE_CONFIG_DIR, XDG_CONFIG_HOME, or ~/.claude. Set it to collect
    # from a copy.
    source_root: ""

    # The same session filter as claude-code-local, judged by the root
    # each record names. Claude Code's own helper sessions run under
    # /private/tmp and are left out.
    include: []
    exclude:
      - /private/tmp/**

    collector:
      mode: watch
      interval: 10m
      max_delta_bytes: 2097152

  # The request and response bodies Claude Code exchanges with its model
  # provider: the system prompt, the tool schemas and every message as it
  # was sent. Claude Code writes them when its environment has
  # OTEL_LOG_RAW_API_BODIES=file:<absolute path of source_root>, for example
  # in the env block of ~/.claude/settings.json. This adapter finds each
  # body's session, and lands it with what the session already holds taken
  # out. On by default because it costs nothing until that variable is set.
  - name: claude-code-provider
    enabled: true

    # Where Claude Code writes the bodies. Leave empty for asz/provider-bodies
    # under CLAUDE_CONFIG_DIR, XDG_CONFIG_HOME/claude, or ~/.claude. The
    # variable must name the same directory by its absolute path: Claude
    # Code does not expand ~, and resolves a relative path against each
    # session's own working directory.
    source_root: ""

    # The same session filter as claude-code-local, judged by the working
    # directory the session's main transcript was recorded under.
    include: []
    exclude:
      - /private/tmp/**

    collector:
      mode: watch
      interval: 10m
      max_delta_bytes: 2097152

  # The sessions Kiro's V3 agent engine writes: kiro-cli started with --v3
  # or with chat.agentEngine set to v3, and Kiro Crew on its kas backend.
  # kiro-cli's V2 and V1 sessions are counted and reported, not collected.
  # On by default because it costs nothing where Kiro is not installed.
  - name: kiro-local
    enabled: true

    # The directory that holds Kiro's sessions directory. Leave empty for
    # ~/.kiro, where the engine writes; it does not read KIRO_HOME. Set it to
    # collect from a copy.
    source_root: ""

    # Session filters, judged by the workspace paths in the session's own
    # header, session.json. A path ending in /** matches that directory and
    # everything beneath it; anything else is a glob over the whole path. A
    # session is left out only when every one of its paths is. Kiro records
    # the real path, so on macOS a session in /tmp is under /private/tmp.
    include: []
    exclude:
      - /private/tmp/**

    collector:
      mode: watch
      interval: 10m
      max_delta_bytes: 2097152

parse:
  # The largest round file the parser writes, in bytes. A round travels
  # whole as one log record, so it is cut at the same budget as a landed
  # file: the parser narrows a round's input window until the round fits,
  # and the rest of the evidence goes to the next round. A round covering
  # a single landed file is published whole even when larger.
  max_round_bytes: 2097152

# The metrics asz derives from the landed files, for every adapter at once:
# agent.token.usage from the model calls of a Claude Code conversation, and
# agent.mcp.calls and agent.mcp.duration from the MCP calls the Claude Code
# plugin saw. They wait in the root's spool until they are sent, so they are
# derived only when they will be: export.otlp.endpoint is set and
# export.otlp.metrics is on.
metrics:
  enabled: true
  # How far back the first derivation over a root reaches. It runs once,
  # before the root holds any metrics, which is usually a new deployment
  # over a source that already has history. A minute older than this is
  # not derived. Every later pass derives each new file whole. A duration
  # such as 72h or 3d; 0 or none means everything.
  lookback: 72h

export:
  # asz collect sends every landed file and every round to an OpenTelemetry
  # logs receiver at the end of every pass, and asz push sends a root that is
  # already there in one pass. Both send them as OTLP logs, over gRPC by default or over HTTP, one log record
  # per file with the file's bytes as the body, so the receiver stores each
  # file as landed and checks its digest at once. Records carry service.name, service.instance.id,
  # service.layer, telemetry.sdk.name "asz", and asz.* attributes naming the
  # format, its version, the file, its kind, its digest and its line count.
  # Landed files and rounds are write-once, so each is sent once;
  # push.state in the storage root records which were.
  otlp:
    # The transport: grpc, or http with a protobuf body. The SkyWalking OAP
    # accepts both. gRPC opens one connection for the run and sends every
    # request of a pass over it.
    protocol: grpc
    # Where the receiver listens. For grpc, host:port: the OAP's gRPC port,
    # 127.0.0.1:11800 by default. For http, the receiver's base URL, to
    # which /v1/logs is appended: the OAP's REST port,
    # http://127.0.0.1:12800. Empty means nothing is sent: asz collect skips
    # the send step, and asz push refuses to run.
    endpoint: ""
    # For grpc, connect with TLS, verified against the system's roots. For
    # http, the scheme of the endpoint decides.
    tls: false
    # The service every record is attributed to. Empty means the runtime
    # that produced each session, read off its landed header: "Claude Code"
    # for claude-code-local, "Mock Agent" for mock. One service per kind of
    # agent.
    service_name: ""
    # Sent as service.instance.id: who is pushing, in words the people
    # reading the receiver recognise. Put your mailbox, your name, or the
    # machine here, for example alice@example.org or build-runner-3. Empty
    # means user@host of the machine running asz push, which is stable
    # across restarts. The session a record belongs to is on the record
    # itself, as asz.session.
    instance_id: ""
    # Sent as service.layer, the layer the receiver places the service in.
    # The OAP selects its rules by layer, and a layer name is upper case
    # with underscores.
    layer: AI_AGENT
    # Sent with every request, as gRPC metadata or as HTTP headers, for
    # example { Authorization: "Bearer ..." }. Empty sends none.
    headers: {}
    # How many file bytes one request carries at most; a file larger than
    # this is sent alone. 8 MiB keeps a request under the 10 MiB the OAP's
    # HTTP server accepts.
    batch_bytes: 8388608
    # At most this many bytes on the wire per minute, for the first push
    # of a large history: a pass waits before a request until a minute's
    # budget covers it. 0 means no limit.
    max_bytes_per_minute: 0
    # The two things a push sends, each on its own switch: the landed files
    # and rounds as OTLP logs, and the metrics spool. A receiver that takes
    # one and not the other is sent what it takes; both off is refused.
    logs: true
    metrics: true

# What asz view and asz server serve. asz knows nothing about who is
# reading: these settings apply to every reader of this instance. Two
# audiences are two instances over the same root, each behind the
# deployment's own authentication, or one instance with hide_override on
# behind a host that sets hide for each reader.
view:
  # The flags whose steps the page withholds from every reader:
  # system_prompt, the system prompt a runtime sent, and tool_schemas, the
  # schemas of the tools it advertised. A withheld step keeps its place,
  # its flags and its size, loses its text, and says so with the state
  # omitted. The provider bodies go with it, since a request carries both
  # again and a body is served whole or not at all. Empty hides nothing.
  hide: []
  # Whether a request's hide parameter replaces hide above for that
  # request. On, a host that serves the API through its own route decides
  # what each reader is kept from, and hide above applies to a request that
  # sets no hide. Off, hide above is the whole answer, and a request that
  # carries the parameter is refused.
  hide_override: false

# asz judge and asz measure. A judge run measures one conversation at one
# head of its chain: the ledger asz computes, then the targets the person
# set, whether each was achieved, and what each piece of work was, each
# stage given to an evaluator. A run happens only when a person runs asz
# judge; nothing in collect, server or push starts one. An evaluator reads
# the conversation, so what it reads goes to the model behind it.
judge:
  # The optional price file: per model, what a million tokens of each type
  # cost, from a time on. Empty prices nothing, and the tokens still count.
  pricing: ""
  # The flags whose records the evaluators are never shown, as view.hide
  # lists them for the page.
  hide: []
  # How long one evaluator call may take. A stage cut into calls runs several,
  # and a call that fails, a timeout included, is tried once more.
  timeout: 30m
  # What one evaluator call may read through the navigation, in bytes of
  # answers. Past it, every tool tells the evaluator to answer with what it
  # read. 0 is no bound.
  read_bytes: 131072
  # How a stage is given to its evaluator: single, one call; stream, cut
  # into chunks; auto, one call when the rows it is given fit single_bytes,
  # chunks of chunk_bytes beyond. concurrency bounds the chunks run at once.
  mode: auto
  single_bytes: 32768
  chunk_bytes: 24576
  concurrency: 4
  # What a call of a targets scan is given of the targets found so far, in
  # bytes; the targets tool gives the rest whole.
  state_bytes: 16384
  # How often a running stage prints what it has consumed so far. 0 prints it
  # only when the stage ends.
  progress: 30s
  # The models and agent CLIs a stage can be given to, by name. kind cli
  # runs an agent CLI: program claude, codex or kiro-cli, found on PATH or
  # at command. kind api calls a provider's API: program anthropic, or
  # openai for any endpoint that speaks the OpenAI chat completions API,
  # with endpoint, model and api_key_env, for example:
  #   haiku:
  #     kind: api
  #     program: anthropic
  #     endpoint: https://api.anthropic.com
  #     model: claude-haiku-4-5
  #     api_key_env: ANTHROPIC_API_KEY
  evaluators:
    claude:
      kind: cli
      program: claude
      args: []
      max_turns: 60
    codex:
      kind: cli
      program: codex
      args: []
    kiro:
      kind: cli
      program: kiro-cli
      args: []
  # What asz judge runs when it is not told one stage: the stages after the
  # ledger, in order, each with its evaluator.
  plan:
    - stage: targets
      evaluator: claude
    - stage: achievement
      evaluator: claude
    - stage: subtasks
      evaluator: claude
    - stage: efficiency
      evaluator: claude
  # The sources asz judge -reference compares a run with: a ticket, an
  # incident report, a person's conclusions. A file and a plain http or https
  # URL need nothing here. A source that needs a login goes through a command
  # given the source as its last argument, which writes the content on its
  # standard output and never sees the conversation, for example:
  #   fetch:
  #     - prefix: https://example.atlassian.net/browse/
  #       command: [jira-export, --markdown]
  #       content_type: text/markdown
  references:
    # A saved copy is cut at this many bytes, and says so.
    max_bytes: 1048576
    # How long one fetch may take.
    timeout: 1m
    fetch: []

# How long a snapshot asz pull made stays on this machine, counted from when
# it was published, with every judge run in it. The newest snapshot expires
# too: pull again for a fresh one. asz pull and asz judge
# -remote-conversation remove the expired ones they find when they start,
# except one a reader still holds, one whose records do not read, and those
# of a conversation another command holds; nothing removes them in the
# background. A duration such as 720h, at least 2s.
remote_snapshot_ttl: 720h

# The asz servers asz pull copies conversations from, to judge them here.
# Each entry needs a name, which names its copies on this machine and stays
# the same when the url changes, and a url. Exactly one of token_file and
# token_env gives the token; neither is read until the remote is contacted.
# For example:
#   - name: prod
#     url: https://asz.example.internal:8788
#     token_file: ~/.asz/prod.token
#     token_env: ""
#     # Replaces the system's trusted roots for this remote.
#     ca_file: ""
#     # Set both or neither.
#     client_cert_file: ""
#     client_key_file: ""
#     # The host the certificate is checked against, when it differs from
#     # the url's, as through a tunnel.
#     server_name: ""
remotes: []

# What asz view and asz server need to answer asz pull. With a tokens file,
# every request to the address needs a token, the page and the requests it
# makes too, and the pull routes are served beside them. Without one, there
# are no pull routes and the page is open.
remote_server:
  # One line per token: a name, a space, and the token's SHA-256 in lower
  # case hexadecimal. asz token create makes a token and its line.
  tokens_file: ""
  tls:
    # Set both to serve TLS on the address. Without them, tokens travel in
    # plain text, which anyone on the path can read and use.
    cert_file: ""
    key_file: ""
    # With TLS, also require a client certificate this authority signed.
    client_ca_file: ""
  # How many requests one token may have running at once. More are refused with
  # 429. 1 to 64.
  max_concurrent_per_token: 2
  # How long a frozen snapshot stays after it was last used, so a pull that
  # stopped half way does not keep it for ever. At least 2s.
  snapshot_ttl: 1h
