# Default configuration for asz.
#
# Every asz command reads this file when it is in the working directory and no
# -config flag is given. Every value below is the built-in default, so deleting
# the file changes nothing. It is here so the defaults can be read and edited
# without reading Go.

storage:
  # Where collected data lands and where conversations are assembled.
  # Relative paths are resolved from the working directory. The default,
  # ./data, is ignored by git so a checkout never stages private transcripts.
  root: ./data

adapters:
  - name: claude-code-local
    enabled: true

    # Where Claude Code keeps its files. Leave empty to resolve it the way
    # Claude Code does: CLAUDE_CONFIG_DIR, then XDG_CONFIG_HOME, then
    # ~/.claude. Set it only to collect from a copy or a mounted corpus.
    source_root: ""

    # Session filters. A session is judged by the working directory its main
    # transcript was recorded under. An entry starting with / is a working
    # directory, with ** for everything beneath it; anything else is a glob
    # matched against the source directory name as Claude Code wrote it.
    # An empty include list means every session is a candidate.
    include: []
    # Claude Code runs its own helper agents in scratch directories under
    # /private/tmp. Those sessions are the tool's, not yours, so they are
    # left out. A real session that merely used a scratch directory for a
    # child agent is still collected, because the filter looks at the main
    # transcript's directory only.
    exclude:
      - /private/tmp/**

    collector:
      # watch polls the source continuously. once makes a single pass and
      # exits, which is the backfill path over history that already exists.
      # asz view in watch mode also refreshes on this interval and shows the
      # last and the next refresh on its list page.
      mode: watch
      interval: 5s

      # The largest landed file the collector writes, in bytes. A large
      # catch-up is split into several files rather than one enormous one,
      # and a single record larger than this is landed whole. It is also the
      # largest unit a receiver must accept in one message when landed files
      # travel, so 4 MiB keeps under the default limit of an OpenTelemetry
      # Collector. A change applies to new files only: asz repack re-cuts an
      # existing root into a new one.
      max_delta_bytes: 4194304

export:
  # asz push sends every landed file and every round to an OpenTelemetry logs
  # receiver over OTLP/HTTP, one log record per file line, so the receiver can
  # write the files back byte for byte. Records carry service.name,
  # service.instance.id (the session), service.layer, telemetry.sdk.name
  # "asz", and asz.* attributes naming the format, its version, the file, the
  # line and its kind. Landed files and rounds are write-once, so each is
  # sent once; push.state in the storage root records which were.
  otlp:
    # The receiver's base URL; /v1/logs is appended. The SkyWalking OAP
    # listens on its REST port, http://127.0.0.1:12800 by default. Empty
    # means asz push refuses to run.
    endpoint: ""
    # The service every record is attributed to. Empty means the project
    # directory each session was recorded under, one service per project.
    service_name: ""
    # Sent as service.layer. GENAI is the OAP's layer for generative AI.
    layer: GENAI
    # Headers added to every request, for example
    #   headers: { Authorization: "Bearer ..." }
    # How much body text one request carries at most, and how long push
    # sleeps between passes in watch mode.
    batch_bytes: 1048576
    interval: 5s
