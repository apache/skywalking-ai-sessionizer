# Default configuration for asz.
#
# Every asz command reads this file when it is in the working directory and no
# -config flag is given. Every value below is the built-in default, so deleting
# the file changes nothing. It is here so the defaults can be read and edited
# without reading Go.

storage:
  # Where collected data lands and where conversations are assembled.
  # Relative paths are resolved from the working directory. The default,
  # ./data, is ignored by git so a checkout never stages private transcripts.
  root: ./data

adapters:
  - name: claude-code-local
    enabled: true

    # Where Claude Code keeps its files. Leave empty to resolve it the way
    # Claude Code does: CLAUDE_CONFIG_DIR, then XDG_CONFIG_HOME, then
    # ~/.claude. Set it only to collect from a copy or a mounted corpus.
    source_root: ""

    # Session filters. A session is judged by the working directory its main
    # transcript was recorded under. An entry starting with / is a working
    # directory, with ** for everything beneath it; anything else is a glob
    # matched against the source directory name as Claude Code wrote it.
    # An empty include list means every session is a candidate.
    include: []
    # Claude Code runs its own helper agents in scratch directories under
    # /private/tmp. Those sessions are the tool's, not yours, so they are
    # left out. A real session that merely used a scratch directory for a
    # child agent is still collected, because the filter looks at the main
    # transcript's directory only.
    exclude:
      - /private/tmp/**

    # The runtime's own metric family, derived from the landed files and
    # sent by asz push: claude_code.token.usage, name for name and
    # attribute for attribute with Claude Code's OpenTelemetry exporter, so
    # a receiver holds one family whichever produced it. The first
    # derivation over a root with history reaches back metrics_lookback,
    # 24h unless set; 0 or none means everything.
    metrics: false
    metrics_lookback: 24h

    collector:
      # watch polls the source continuously. once makes a single pass and
      # exits, which is the backfill path over history that already exists.
      # asz view in watch mode also refreshes on this interval and shows the
      # last and the next refresh on its list page.
      mode: watch
      interval: 5s

      # The largest landed file the collector writes, in bytes. A large
      # catch-up is split into several files rather than one enormous one,
      # and a single record larger than this is landed whole. A file travels
      # whole as one log record, so this is also the largest record a
      # receiver has to accept. A change applies to new files only: asz
      # repack re-cuts an existing root into a new one.
      max_delta_bytes: 2097152

parse:
  # The largest round file the parser writes, in bytes. A round travels
  # whole as one log record, so it is cut at the same budget as a landed
  # file: the parser narrows a round's input window until the round fits,
  # and the rest of the evidence goes to the next round. A round covering
  # a single landed file is published whole even when larger.
  max_round_bytes: 2097152

export:
  # asz push sends every landed file and every round to an OpenTelemetry logs
  # receiver as OTLP logs, over gRPC by default or over HTTP, one log record
  # per file with the file's bytes as the body, so the receiver stores each
  # file as landed and checks its digest at once. Records carry service.name, service.instance.id,
  # service.layer, telemetry.sdk.name "asz", and asz.* attributes naming the
  # format, its version, the file, its kind, its digest and its line count.
  # Landed files and rounds are write-once, so each is sent once;
  # push.state in the storage root records which were.
  otlp:
    # The transport: grpc, or http with a protobuf body. The SkyWalking OAP
    # accepts both. gRPC opens one connection for the run and sends every
    # request of a pass over it.
    protocol: grpc
    # Where the receiver listens. For grpc, host:port: the OAP's gRPC port,
    # 127.0.0.1:11800 by default. For http, the receiver's base URL, to
    # which /v1/logs is appended: the OAP's REST port,
    # http://127.0.0.1:12800. Empty means asz push refuses to run.
    endpoint: ""
    # For grpc, connect with TLS, verified against the system's roots. For
    # http, the scheme of the endpoint decides.
    tls: false
    # The service every record is attributed to. Empty means the runtime
    # that produced each session, read off its landed header: "Claude Code"
    # for claude-code-local, "Mock Agent" for mock. One service per kind of
    # agent.
    service_name: ""
    # Sent as service.instance.id: who is pushing, in words the people
    # reading the receiver recognise. Put your mailbox, your name, or the
    # machine here, for example wusheng@tetrate.io or build-runner-3. Empty
    # means user@host of the machine running asz push, which is stable
    # across restarts. The session a record belongs to is on the record
    # itself, as asz.session.
    instance_id: ""
    # Sent as service.layer, the layer the receiver places the service in.
    # The OAP selects its rules by layer, and a layer name is upper case
    # with underscores.
    layer: AI_AGENT
    # Sent with every request, as gRPC metadata or as HTTP headers, for
    # example
    #   headers: { Authorization: "Bearer ..." }
    # How many file bytes one request carries at most; a file larger than
    # this is sent alone. 8 MiB keeps a request under the 10 MiB the OAP's
    # HTTP server accepts. And how long push sleeps between passes in
    # watch mode.
    batch_bytes: 8388608
    # At most this many bytes on the wire per minute, for the first push
    # of a large history: a pass waits before a request until a minute's
    # budget covers it. 0 means no limit.
    max_bytes_per_minute: 0
    interval: 5s
